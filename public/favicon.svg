<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <!-- Polaroid frame shadow -->
  <rect x="7" y="5" width="50" height="54" rx="5" fill="#E8C8D8" opacity="0.4"/>
  <!-- Polaroid frame -->
  <rect x="5" y="3" width="50" height="54" rx="5" fill="#fff" stroke="url(#frame)" stroke-width="2.5"/>
  <!-- Tab at top -->
  <rect x="23" y="1" width="14" height="6" rx="2" fill="#F8B4CC"/>
  <!-- Inner photo area -->
  <rect x="10" y="9" width="40" height="36" rx="2" fill="url(#inner)"/>
  <!-- Glow behind hearts -->
  <ellipse cx="30" cy="26" rx="16" ry="14" fill="url(#glow)" opacity="0.5"/>
  <!-- Heart 1 (pink, left) -->
  <path d="M22 22c0-4 3.5-7 7-7s5 3 5 3 1.5-3 5-3 7 3 7 7c0 6-12 14-12 14S22 28 22 22z" fill="url(#heart1)" opacity="0.85"/>
  <!-- Heart 2 (purple, right, offset) -->
  <path d="M25 24c0-3.5 3-6 6-6s4.5 2.5 4.5 2.5S37 18 40 18s6 2.5 6 6c0 5.5-10.5 12-10.5 12S25 29.5 25 24z" fill="url(#heart2)" opacity="0.75"/>
  <!-- Sparkle stars -->
  <g fill="#F8B4CC" opacity="0.9">
    <polygon points="16,14 17,16 19,16 17.5,17.5 18,20 16,18.5 14,20 14.5,17.5 13,16 15,16"/>
    <polygon points="42,12 42.8,14 45,14 43.2,15.2 43.6,17 42,15.8 40.4,17 40.8,15.2 39,14 41.2,14"/>
    <polygon points="15,32 15.6,33.5 17,33.5 15.9,34.5 16.3,36 15,35 13.7,36 14.1,34.5 13,33.5 14.4,33.5"/>
    <polygon points="44,28 44.5,29.2 46,29.2 44.8,30 45.2,31.2 44,30.4 42.8,31.2 43.2,30 42,29.2 43.5,29.2"/>
    <polygon points="30,11 30.4,12 31.4,12 30.6,12.8 30.8,13.8 30,13.2 29.2,13.8 29.4,12.8 28.6,12 29.6,12"/>
    <polygon points="38,34 38.4,35 39.4,35 38.6,35.7 38.9,36.6 38,36 37.1,36.6 37.4,35.7 36.6,35 37.6,35"/>
  </g>
  <!-- Small heart icon bottom-left -->
  <path d="M13,49c0-1.2 1-2.2 2.2-2.2s1.5.9 1.5.9.5-.9 1.5-.9 2.2 1 2.2 2.2c0 1.8-3.7 4.2-3.7 4.2S13,50.8 13,49z" fill="#E98AAF"/>
  <!-- Small search icon bottom -->
  <circle cx="25" cy="50" r="2" stroke="#C8A0D0" stroke-width="1.2" fill="none"/>
  <line x1="26.5" y1="51.5" x2="28" y2="53" stroke="#C8A0D0" stroke-width="1.2" stroke-linecap="round"/>
  <defs>
    <linearGradient id="frame" x1="5" y1="3" x2="55" y2="57">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="inner" x1="10" y1="9" x2="50" y2="45">
      <stop offset="0%" stop-color="#FFF0F5"/>
      <stop offset="100%" stop-color="#FDE8F0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F0ABFC" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#F0ABFC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heart1" x1="22" y1="15" x2="39" y2="36">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="heart2" x1="25" y1="18" x2="46" y2="36">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
  </defs>
</svg>
