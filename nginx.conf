server {
    listen 8091;
    server_name main.couplestory.site;
    root /usr/share/nginx/html;
    index index.html;

    # Photo and music uploads (the API allows 10 MB per file)
    client_max_body_size 20m;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Security headers. HSTS is switched on at Cloudflare (this server only speaks HTTP behind the tunnel).
    # nginx drops every inherited add_header inside a location that declares its own add_header, so
    # such locations repeat X-Content-Type-Options. scripts/check-nginx-conf.mjs enforces this.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Report-Only first: watch the browser console for violations for a week, adjust the source
    # lists, then rename this header to Content-Security-Policy to enforce it.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # Proxy API requests to backend
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $backend http://couplestory-api:8087;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The API sends its own copies of these (X-Frame-Options DENY); keep one authoritative value.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
    }

    # Proxy uploaded files to backend
    location /uploads/ {
        resolver 127.0.0.11 valid=30s;
        set $backend http://couplestory-api:8087;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
    }

    # SPA fallback - serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
